<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEDLEX 教師後台</title>
  <style>
    :root{--accent:#177a89;--soft:#e7f4f5;--ink:#263238;--muted:#718085;--line:#dfe7e8;--danger:#b44b57}
    *{box-sizing:border-box}body{margin:0;background:#f6f8f8;color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif}
    button,input,textarea{font:inherit}button{cursor:pointer}.shell{width:min(1080px,calc(100% - 28px));margin:auto;padding:28px 0 50px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--accent);border-radius:50%;color:var(--accent);font-weight:900}
    h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}
    .auth{max-width:500px;margin:60px auto}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:grid;gap:6px;flex:1;min-width:190px}
    input,textarea{width:100%;padding:11px;border:1px solid #cfdadd;border-radius:7px;background:#fff}textarea{min-height:82px;resize:vertical}
    button{border:1px solid var(--line);border-radius:7px;padding:10px 14px;background:#fff;color:var(--ink);font-weight:700}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.danger{color:var(--danger)}
    nav{display:flex;gap:8px;margin-bottom:18px}.tab.active{background:var(--accent);color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
    table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}
    .badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#edf2f3;font-size:12px}.badge.live{background:#e3f3e8;color:#246b43}
    .checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:310px;overflow:auto;border:1px solid var(--line);padding:12px;border-radius:8px}.check{display:flex;gap:8px;align-items:flex-start;padding:7px}.check input{width:auto;margin-top:3px}
    .notice{min-height:24px;color:var(--accent);font-weight:700;margin-top:10px}.hidden{display:none!important}@media(max-width:720px){.checks{grid-template-columns:1fr}table{font-size:14px}.toolbar{align-items:stretch;flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><div class="mark">+</div><div><b>MEDLEX</b><div class="muted">Medical English quiz platform</div></div></div><a href="medical-english-crossword.html">學員練習</a></header>
    <section id="authView" class="card auth">
      <h1>教師帳號</h1><p class="muted">登入後管理自己的題庫與公開測驗。</p>
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><br>
      <div class="field"><label>密碼</label><input id="password" type="password" minlength="6" autocomplete="current-password"></div><br>
      <div class="row"><button id="loginBtn" class="primary">登入</button><button id="signupBtn">建立帳號</button></div>
      <div id="authMessage" class="notice"></div>
    </section>
    <section id="appView" class="hidden">
      <div class="toolbar"><div><h1>教師後台</h1><span id="account" class="muted"></span></div><button id="logoutBtn">登出</button></div>
      <nav><button class="tab active" data-view="questions">我的題庫</button><button class="tab" data-view="quizzes">我的測驗</button></nav>
      <section id="questionsView">
        <div class="card"><h2 id="questionFormTitle">新增題目</h2><input id="questionId" type="hidden"><div class="row"><div class="field"><label>英文答案</label><input id="term" placeholder="例如：CARDIAC"></div><div class="field"><label>分類</label><input id="category" placeholder="例如：Anatomy"></div></div><br><div class="field"><label>題目提示</label><textarea id="clue" placeholder="請避免在提示中直接透露答案"></textarea></div><br><div class="row"><button id="saveQuestionBtn" class="primary">儲存題目</button><button id="cancelQuestionBtn" class="hidden">取消編輯</button></div><div id="questionMessage" class="notice"></div></div>
        <div class="card"><div class="toolbar"><h2>題庫</h2><span id="questionCount" class="muted"></span></div><div style="overflow:auto"><table><thead><tr><th>答案</th><th>提示</th><th>分類</th><th>操作</th></tr></thead><tbody id="questionRows"></tbody></table></div></div>
      </section>
      <section id="quizzesView" class="hidden">
        <div class="card"><h2 id="quizFormTitle">建立測驗</h2><input id="quizId" type="hidden"><div class="row"><div class="field"><label>測驗名稱</label><input id="quizTitle" placeholder="例如：解剖學基礎測驗"></div><div class="field"><label>網址代碼</label><input id="quizSlug" placeholder="例如：anatomy-basic"></div></div><br><label>選擇題目（至少 10 題）</label><div id="questionChecks" class="checks"></div><br><div class="row"><button id="saveQuizBtn" class="primary">儲存測驗</button><button id="cancelQuizBtn" class="hidden">取消編輯</button></div><div id="quizMessage" class="notice"></div></div>
        <div class="card"><h2>測驗列表</h2><div style="overflow:auto"><table><thead><tr><th>名稱</th><th>狀態</th><th>分享網址</th><th>操作</th></tr></thead><tbody id="quizRows"></tbody></table></div></div>
      </section>
    </section>
  </main>
  <script src="admin.js"></script>
</body>
</html>
