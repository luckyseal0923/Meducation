<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDLEX 醫學英文填字平台</title>
<style>:root{--a:#177a89;--ink:#263238;--muted:#718085;--line:#dfe7e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f8f8;color:var(--ink);font-family:Arial,"Microsoft JhengHei",sans-serif}.hero{width:min(920px,calc(100% - 30px));background:#fff;border:1px solid var(--line);border-radius:16px;padding:clamp(28px,6vw,70px);display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}small{color:var(--a);font-weight:900;letter-spacing:.12em}h1{font-size:clamp(34px,6vw,62px);line-height:1.05;margin:14px 0 18px}p{color:var(--muted);line-height:1.8}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}a{padding:12px 18px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);font-weight:800}a.primary{background:var(--a);border-color:var(--a);color:#fff}.art{aspect-ratio:1;border-radius:50%;background:url('medical-crossword-background.png') center/cover;border:1px solid var(--line)}@media(max-width:700px){.hero{grid-template-columns:1fr}.art{display:none}}</style></head>
<body><main class="hero"><div><small>MEDLEX PLATFORM</small><h1>醫學英文<br>填字學習平台</h1><p>教師建立個人題庫並發布專屬測驗網址；學員免登入即可進行互動式填字練習。</p><div class="actions"><a class="primary" href="admin.html">教師登入／註冊</a><a href="medical-english-crossword.html">隨機練習</a></div></div><div class="art" aria-hidden="true"></div></main></body></html>
