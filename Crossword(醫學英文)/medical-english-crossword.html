<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEDLEX Crossword | Medical English</title>
  <style>
    :root { --accent:#177a89; --accent-soft:#e7f4f5; --paper:#ffffff; --page:#f7f8f8; --ink:#273236; --muted:#718085; --line:#e2e8e9; --danger:#bf5560; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; font-family:Inter,Arial,"Microsoft JhengHei",sans-serif; color:var(--ink); background:var(--page); }
    button,input { font:inherit; } button { cursor:pointer; }
    .shell { width:min(1020px,calc(100% - 32px)); margin:0 auto; padding:30px 0 44px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:28px; }
    .brand { display:flex; gap:10px; align-items:center; } .mark { width:34px;height:34px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:18px;font-weight:700; }
    .brand small { display:block; letter-spacing:.12em; color:var(--muted); font-size:10px; font-weight:800; } .brand h1 { margin:2px 0 0; font-size:18px; font-weight:700; }
    .progress { min-width:180px; } .progress-label { display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px; } .bar { height:5px;background:#e5eaeb;border-radius:99px;overflow:hidden; } .bar span { display:block;height:100%;width:0;background:var(--accent);transition:width .25s; }
    .card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:clamp(20px,4vw,38px); max-width:960px; margin:0 auto; }
    .intro { display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:28px; } .eyebrow { color:var(--accent);font-weight:800;font-size:11px;letter-spacing:.12em;margin:0 0 7px; } h2 { font-size:clamp(24px,4vw,34px);margin:0 0 8px;letter-spacing:-.035em;font-weight:750; } .intro p:not(.eyebrow) { color:var(--muted);margin:0;line-height:1.65; }
    .score { border-left:1px solid var(--line);color:var(--muted);padding:4px 0 4px 18px;min-width:76px;text-align:left;font-size:12px; } .score b { display:block;font-size:20px;color:var(--ink);margin-top:3px; }
    .play { display:grid;grid-template-columns:minmax(390px,1.25fr) minmax(230px,.75fr);gap:30px;align-items:start;max-width:820px;margin:0 auto; }
    .grid-panel { background:#fafcfc; padding:16px; border:1px solid var(--line);border-radius:10px;overflow:auto; }
    .grid { width:100%; min-width:390px; display:grid; grid-template-columns:repeat(15,1fr); aspect-ratio:1; gap:2px; background:#dce5e7 url('medical-crossword-background.png') center/cover no-repeat; padding:2px; border-radius:4px; }
    .cell { position:relative;background:transparent;min-width:0; } .cell.active { background:#fff; } .cell input { width:100%;height:100%;border:0;text-align:center;text-transform:uppercase;background:#fff;color:var(--ink);font-size:clamp(14px,2.2vw,21px);font-weight:750;outline:1px solid transparent;transition:.16s; } .cell input:focus,.cell.current input { background:var(--accent-soft);outline:1px solid var(--accent);z-index:2;position:relative; } .cell.good input { background:#e2f2e8;color:#2e6c49; } .cell.bad input { background:#fbe7e8;color:#a53e48; }
    .number { position:absolute;left:3px;top:2px;font-size:8px;color:#7d9095;font-weight:800;pointer-events:none;z-index:3; }
    .side { display:grid;gap:14px; } .clues { border:1px solid var(--line);border-radius:10px;background:#fff;padding:16px; }
    .clues h3 { margin:0 0 10px;font-size:11px;letter-spacing:.1em;color:var(--muted); } .clue { border:0;background:transparent;color:var(--ink);text-align:left;width:100%;padding:8px 6px;border-radius:5px;display:flex;gap:9px;align-items:baseline; } .clue:hover,.clue.selected { background:var(--accent-soft);color:#145967; } .clue b { color:var(--accent);min-width:18px; } .clue span { font-size:14px;line-height:1.35; }
    .actions { display:flex;gap:9px;flex-wrap:wrap;margin-top:24px; } .actions button { border-radius:7px;border:1px solid transparent;padding:10px 14px;font-weight:750;font-size:14px; } #check { background:var(--accent);color:#fff; } #hint { background:#fff;color:#896918;border-color:#e8d8aa; } #reset { background:#fff;color:#5d7076;border-color:var(--line); }
    .message { min-height:24px;margin:13px 0 0;font-weight:700;color:#187c74;font-size:14px; } .message.error { color:var(--danger); }
    .footer { color:#8b9a9e;text-align:center;font-size:12px;margin:18px 0 0; }
    @media(max-width:820px){ .top,.intro { align-items:flex-start;flex-direction:column; } .progress { width:100%; } .play { grid-template-columns:1fr;gap:22px; } .grid { min-width:340px; } .grid-panel { padding:10px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">+</div><div><small>MEDLEX LAB</small><h1>Medical English Crossword</h1></div></div><div class="progress"><div class="progress-label"><span>&#x5B8C;&#x6210;&#x5EA6;</span><strong id="progressText">0 / 10</strong></div><div class="bar"><span id="progressBar"></span></div></div></header>
    <section class="card">
      <div class="intro"><div><p class="eyebrow">ANATOMY &amp; CLINICAL BASICS</p><h2>&#x91AB;&#x5B78;&#x82F1;&#x6587;&#x586B;&#x5B57;&#x904A;&#x6232;</h2><p>&#x9EDE;&#x9078;&#x683C;&#x5B50;&#x5F8C;&#x4EE5;&#x9375;&#x76E4;&#x8F38;&#x5165;&#x82F1;&#x6587;&#x55AE;&#x5B57;&#x3002;&#x5B8C;&#x6210;&#x5F8C;&#x6309;&#x300C;&#x6AA2;&#x67E5;&#x7B54;&#x6848;&#x300D;&#x3002;</p></div><div class="score"><span>&#x5F97;&#x5206;</span><b id="score">0 / 10</b></div></div>
      <div class="play"><div class="grid-panel"><div class="grid" id="grid" aria-label="Medical English crossword grid"></div></div><aside class="side"><section class="clues"><h3>ACROSS</h3><div id="across"></div><h3 style="margin-top:18px">DOWN</h3><div id="down"></div></section></aside></div>
      <div class="actions"><button id="check" type="button">&#x2713; &#x6AA2;&#x67E5;&#x7B54;&#x6848;</button><button id="hint" type="button">&#x1F4A1; &#x7D66;&#x6211;&#x4E00;&#x500B;&#x63D0;&#x793A;</button><button id="reset" type="button">&#x21BB; &#x91CD;&#x65B0;&#x958B;&#x59CB;</button><button id="newQuiz" type="button">&#x2726; &#x65B0;&#x7684;&#x6E2C;&#x9A57;</button></div><div class="message" id="message" aria-live="polite"></div>
    </section><p class="footer">10 medical terms &middot; keyboard friendly &middot; one letter at a time</p>
  </main>
  <script src="clinical-questions.js"></script>
  <script src="medical-crossword.js?v=20260804-2"></script>
</body>
</html>
